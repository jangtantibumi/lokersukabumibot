name: Bot Loker Sukabumi Autopilot

on:
  schedule:
    # Berjalan setiap 3 jam
    - cron: '0 */3 * * *'
  workflow_dispatch: # Memungkinkan eksekusi manual dari tombol di GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Bot Main Script
      run: |
        python main.py
      env:
        PYTHONUNBUFFERED: "1"

    - name: Simpan Perubahan Database
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "bot@lokersukabumi.my.id"
        git add posted_jobs.db
        git commit -m "Update database: Loker baru berhasil diposting" || exit 0
        git push
